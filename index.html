function deepMerge(target, source){
  for(const k in source){
    if(source[k] && typeof source[k]==='object' && !Array.isArray(source[k]) && target[k] && typeof target[k]==='object' && !Array.isArray(target[k])){
      deepMerge(target[k], source[k]);
    } else {
      target[k] = source[k];
    }
  }
  return target;
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved.session){ state.session = deepMerge(newSession(), saved.session); delete saved.session; }
      deepMerge(state, saved);
    } else {
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if(old){ const o = JSON.parse(old); if(typeof o.volume==='number') state.volume = o.volume; }
    }
  }catch(e){}
  if(!['basics','howto','work','feedback'].includes(state.currentMenu)) state.currentMenu = 'basics';
}

/* ============ Web Audio（瞑想BGM） ============ */
let audioCtx=null, masterGain=null, activeOsc=[], currentPreviewKey=null, isMainPlaying=false;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = state.volume;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 4500;
    masterGain.connect(filter).connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function stopAllTones(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  activeOsc.forEach(({osc,gain,extra})=>{
    try{
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0.0001, now+0.6);
      osc.stop(now+0.7);
      (extra||[]).forEach(o=>{ try{ o.stop(now+0.7); }catch(e){} });
    }catch(e){}
  });
  activeOsc = [];
  currentPreviewKey = null;
  isMainPlaying = false;
}
function playTones(freqs){
  stopAllTones();
  const ctx = ensureAudio();
  const now = ctx.currentTime;
  freqs.forEach((f)=>{
    const toneGain = ctx.createGain();
    toneGain.gain.value = 0.0001;
    toneGain.connect(masterGain);

    const osc1 = ctx.createOscillator(); osc1.type='sine';     osc1.frequency.value=f;
    const osc2 = ctx.createOscillator(); osc2.type='sine';     osc2.frequency.value=f*1.004;
    const osc3 = ctx.createOscillator(); osc3.type='triangle'; osc3.frequency.value=f*2;

    const g1 = ctx.createGain(); g1.gain.value=0.55;
    const g2 = ctx.createGain(); g2.gain.value=0.35;
    const g3 = ctx.createGain(); g3.gain.value=0.18;

    osc1.connect(g1).connect(toneGain);
    osc2.connect(g2).connect(toneGain);
    osc3.connect(g3).connect(toneGain);

    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.06;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=2.5;
    lfo.connect(lfoGain).connect(osc1.frequency);
    lfo.connect(lfoGain).connect(osc2.frequency);

    [osc1,osc2,osc3,lfo].forEach(o=>o.start(now));
    toneGain.gain.linearRampToValueAtTime(0.16/freqs.length+0.05, now+2.2);
    activeOsc.push({osc:osc1, gain:toneGain, extra:[osc2,osc3,lfo]});
  });
}
function setVolume(v){
  state.volume = parseFloat(v);
  save();
  if(masterGain) masterGain.gain.value = state.volume;
}
function toggleMainBGM(){
  if(isMainPlaying){ stopAllTones(); }
  else { playTones(MAIN_KEYS.map(k=>CHAKRAS.find(c=>c.key===k).freq)); isMainPlaying=true; }
  render();
}
function togglePreview(key,freq){
  if(currentPreviewKey===key){ stopAllTones(); }
  else { playTones([freq]); currentPreviewKey=key; }
  render();
}

/* 候補の絞り込み：
   ・良い面は深い層ほど重く、課題は補助（今の状態＝第4層の課題はごく軽く）。課題だけでは候補にしない。
   ・同じ方向の特徴が複数の層に出ていれば加点する。選んだ回数ではなく、層をまたいだつながりを見る。 */
function suggestSouls(s){
  const sig = {};
  const add = (name, w, why, layer, kind) => { (sig[name]=sig[name]||[]).push({w, why, layer, kind}); };
  [4,3,2,1].forEach(n=>{
    const g = s.ans[`l${n}_good_good`], is = s.ans[`l${n}_issue_issue`];
    if(g) (TRAIT_SOULS[g]||[]).forEach(name=>add(name, LAYER_W.good[n], `第${n}層の良い面で「${g}」を選んだ`, n, 'good'));
    if(is) (TRAIT_SOULS[is]||[]).forEach(name=>add(name, LAYER_W.issue[n], `第${n}層の課題になりやすい面で「${is}」を選んだ`, n, 'issue'));
  });
  SOUL_RULES.forEach(([k,v,why,names])=>{
    if(s.ans[k]!==v) return;
    const n = +k[1];
    names.forEach(name=>add(name, LAYER_W.rule[n], why, n, n===4 ? 'surface' : 'rule'));
  });
  (s.colors||[]).forEach(c=>(SOUL_COLOR_RULES[c]||[]).forEach(name=>add(name, 0.3, `第4層の色で「${c}」を選んだ`, 4, 'surface')));
  (s.colors1||[]).forEach(c=>(SOUL_COLOR_RULES[c]||[]).forEach(name=>add(name, 0.6, `第1層の魂の色で「${c}」を選んだ`, 1, 'rule')));
  const text = allFreeText(s);
  SOUL_WORD_RULES.forEach(([re,names,label])=>{
    const m = text.match(re);
    if(m) names.forEach(name=>add(name, 1, `自由記述に「${m[0]}」など、${label}があった`, 0, 'word'));
  });
  const res = Object.entries(sig).map(([name, list])=>{
    const deep = new Set(list.filter(x=>['good','rule'].includes(x.kind) && x.layer && x.layer<4).map(x=>x.layer));
    const posLayers = new Set(list.filter(x=>['good','rule','surface'].includes(x.kind) && x.layer).map(x=>x.layer));
    const hasPositive = list.some(x=>x.kind!=='issue');
    let score = list.reduce((t,x)=>t+x.w, 0) + Math.max(0, posLayers.size-1) * 1;
    return {name, score, list, deep, posLayers, hasPositive};
  }).filter(r=>r.hasPositive && r.deep.size>=1 && r.posLayers.size>=2 && r.score>=3.5 && (!SOUL_REQUIRE[r.name] || SOUL_REQUIRE[r.name](s, text)))
    .sort((a,b)=>b.score-a.score || SOULS.findIndex(x=>x.name===a.name)-SOULS.findIndex(x=>x.name===b.name));
  const top = res.length ? res[0].score : 0;
  return res.filter(r=>r.score >= top*0.5).slice(0,3).map(r=>{
    const reasons = [...r.list].sort((a,b)=>b.w-a.w).filter((x,i,a)=>a.findIndex(y=>y.why===x.why)===i).slice(0,3).map(x=>x.why);
    const layers = [...r.posLayers].sort((a,b)=>b-a);
    if(layers.length>=2) reasons.push(`第${layers.join('・第')}層で、同じ方向の特徴が重なっている`);
    return {name:r.name, reasons};
  });
}

  const pick = (s.soulPicks||[])[0];
  if(pick==='その他') return (s.soulOther||'').trim() ? `その他（${s.soulOther.trim()}）` : 'その他';
  if(pick) return pick;

function soulRecordLines(s){
  const sug = s.suggested && s.suggested.length ? s.suggested : suggestSouls(s);
  const lines = [];
  lines.push('・アプリが記録から挙げた候補（提案であり、確定ではない）：');
  if(sug.length) sug.forEach(c=>lines.push(`　${c.name}（理由：${c.reasons.join('／')}）`));
  else lines.push('　候補なし（記録が少なく、挙げられなかった）');
  const picks = s.soulPicks||[];
  const st = s.soulStatus==='unknown' ? 'まだ分からない（保留）' : s.soulStatus==='none' ? '候補はどれも違うと感じた' : '';
  lines.push(`・本人が選んだもの（一つ）：${picks.length ? soulTypeText(s) : (st || '未回答')}`);
  if(picks.length && st) lines.push(`・本人の感じ方：${st}`);
  return lines;
}

function selVisible(s, n, q, x){ return !x.when || s.ans[`l${n}_${q.id}_${x.when.k}`]===x.when.v; }
function layerRecordLines(s, n){
  const lines = [];
  LAYER_ITEMS[n].forEach(q=>{
    const b = holdKey(n,q);
    const hv = s.hold[b] ? '分からない／保留' : '未回答';
    q = Object.assign({}, q, {t: q.rl || q.t});
    if(q.era) lines.push(`・${q.t}：${eraText(s,b) || hv}`);
    if(q.region){
      lines.push(`・${q.t}：${regionText(s,b) || hv}`);
      const pl = (s.txt[b+'_place']||'').trim();
      if(pl) lines.push(`・${q.t}（国や地名の補足）：${pl}`);
    }
    (q.sel||[]).forEach(x=>{
      if(!selVisible(s,n,q,x)) return;
      const label = (q.sel.length>1 && x.l) ? `${q.t}（${x.l.replace(/（.*?）/g,'')}）` : q.t;
      lines.push(`・${label}：${s.ans[selKey(n,q,x)] || hv}`);
    });
    if(q.colors) lines.push(`・${q.t}：${(s[q.colors]||[]).length ? s[q.colors].join('、') : hv}`);
    (q.inp||[]).forEach(i=>{
      const v = (s.txt[selKey(n,q,i)]||'').trim();
      lines.push(`・${q.t}（${i.l.replace(/（.*?）/g,'').replace(/？$/,'')}）：${v || hv}`);
    });
  });
  lines.push(`・${NOTE_LABEL[n].l}：${(s.note[n]||'').trim() || '未回答'}`);
  return lines;
}

2. ${self ? '冒頭' : '挨拶のあと'}に、まず結論として「魂の種類・魂体の特徴」と「魂のルーツ」を伝えること。外側から順番に説明する構成にはしないこと。結論への導入には、「結論からお伝えすると」「今回、特に印象に残ったのは」など、内容に合う表現を選び、毎回同じ書き出しに固定しないこと。
3. 魂の種類は、メモの「本人が選んだもの（一つ）」を、鑑定士が見立てた結論として書くこと。本人が選んでいない場合や「まだ分からない」の場合は、魂の種類を一つに決めず、「〜の性質が見えています」のように書くこと。メモにある「アプリが挙げた理由」は、そのまま書き写さないこと。
4. 魂のルーツは、メモにある範囲（国内・国外、地域、時代、人物、役割など）だけで伝えること。分からない部分は補わないこと。
5. 結論のあとは、【文章の組み立て】の順で、一つのつながった文章にすること。見出しや箇条書きにはしないこと。
6. 解釈の理由は、「何が見えたか」→「そこにどんな性質や思いが表れているか」→「それが魂の種類や今の状態とどうつながるか」の順で伝えること。理由の出どころは、魂の奥深くに見えた姿、過去世の場面、心の奥の感情、今表に現れている様子など、魂視の中身で示すこと。「そのようなエネルギーを感じます」「過去世が影響しているようです」だけで終わらせないこと。
7. 説得力は、強い断定や大げさな表現ではなく、見えたことと解釈のつながりから生み出すこと。因果関係が確かめられない部分は、「共通するテーマ」「〜と読み解けます」「重なっているように感じられます」のように表すこと。
8. 色や重さなどの印象は、報告だけで終わらせないこと。その印象が、どんな思い・経験・役割・今の心の状態と結びつくのかを説明すること。色だけで、魂の種類や善し悪しを決めないこと。
9. 人物、場所、時代、役割、出来事、残っている思いなど、特徴的なものを優先して取り上げること。すべてを読み上げる必要はない。
10. 過去世と今世を、あいまいに混ぜないこと。過去世は、人物像・役割・出来事・残っている思いを示して読み解くこと。今世は、心の奥の感情や、今表に現れている様子のどこと結びつくのかを書くこと。両者に共通点がある場合は、「守ろうとする思い」「果たせなかった役割」など、何が重なっているのかを具体的な言葉にすること。今世の出来事がメモにない場合は、最近そのような出来事があったと作り足さないこと。
11. 良い面と課題になりやすい面がメモにあれば、別々に並べず、「その長所が強く働くことで、どんな負担につながりやすいか」まで自然に説明すること。今表に現れている疲れなどは今の状態として扱い、魂の本質を否定的に書かないこと。
12. メモにない出来事や感情（最近の出来事、苦労、嫉妬、恨み、後悔など）を作らないこと。「未回答」「分からない／保留」のものは、文章に使わないこと。
13. 神様・仏様は、魂視の中で感じられた印象として書くこと。メモにない名前や姿は補わないこと。神様・仏様を感じたことだけで、魂の種類を決めつけないこと。
14. 肌の色や地域の印象から、国籍・人種を決めつけないこと。後悔・自責の思い・因縁・業（カルマ）、未浄化魂・未調和魂・執着魂を、罰や魂の優劣、未熟さとして書かないこと。その人を責めたり、不安をあおったりする表現は使わず、心の奥に残る思いや人との距離の取り方として、やさしく受け止めて書くこと。
15. メモの「追加で伝えたいこと」は、その言葉を引用せず、内容として自然に生かすこと。
16. 文と文の関係が伝わるように、「また」「さらに」「そのため」「一方で」「ただ」「とはいえ」「だからこそ」などを、内容に合わせて自然に使うこと。すべての文を接続詞で始めたり、同じ接続詞をくり返したりしないこと。「しかし」は対比があるときだけ使うこと。
17. 短い文を細かく並べすぎないこと。関連する内容は「〜であり」「〜という思いがある一方で」「〜だからこそ」などで一つの文につなげ、短い文も適度に交えてリズムを付けること。文を長くすること自体を目的にしないこと。
（単調な例）人を支えることを大切にしています。責任感があります。自分を後回しにしがちです。
（よい例）人を支えることを大切にし、引き受けた役割を最後まで果たそうとする責任感がうかがえます。ただ、その思いが強いからこそ、自分の気持ちを後回しにしてしまうこともあるのかもしれません。
18. 特徴や課題の背景にある思いや、これまで大切にしてきたことにも目を向け、その人をいたわる言葉につなげること。ただし、メモにない苦労を作ったり、抽象的な褒め言葉を重ねたりしないこと。
19. 改行は、句点「。」で終わる文を基本2文続けて一つの段落にし、段落のあとに空行を1行入れること。一つの段落では一つの話題を扱うこと。結びだけは、1文ずつ改行した3行にまとめること（結びの中に空行は入れない）。
20. 見出し、アスタリスク、絵文字、装飾記号は使わないこと。難しい言葉や大げさな表現、同じ説明や抽象的な褒め言葉のくり返しは避け、一人の相手にていねいに語りかけること。
21. 全体は、${self ? '' : '挨拶と'}結びを含めて1000文字程度にすること。結びを足して長くするのではなく、重複や不要な説明を削って収めること。

【結びのルール】
22. 結びは、短い3行ですっきり締めくくること。
23. 1行目と2行目で、今回の魂の特徴と、いちばん大切なテーマを簡潔にまとめること。1行目は、冒頭で伝えた結論（魂の種類と、その大切な性質）を短く言い直してよい。
24. 3行目には、鑑定内容に沿った、日常で意識できる助言を一つだけ添えること。語尾は「〜なさってくださいね」「〜するときは、少し意識してみてくださいね」など、やさしく語りかける形にすること。「〜するべきです」「〜に気をつけてください」のような強い言い方はしないこと。
25. 結びに、長い励ましや、感謝の挨拶（「心からの感謝を込めて」など）は入れないこと。本文にない新しい解釈や話題も出さないこと。

【文章の組み立て】
次の順で段落を組み立て、全体を一つのテーマでつなげること。
${self ? '' : `・挨拶（指定の2文）
`}・結論：魂の種類と、魂体の特徴（光・温かさ・色・感じなど）。
・魂のルーツ：地域・時代・人物・役割・場面と、神様・仏様の印象。
・理由：見えた姿や場面から、どんな性質が読み取れ、それが魂の種類とどうつながるか。
・過去世：人物像・役割・出来事・残っている思いと、そこにある思い。
・今の心と状態：心の奥の感情と、今表に現れている様子。過去世と重なる点を具体的な言葉にし、いたわる言葉につなげる。
・結び（3行）：2行で魂の特徴と大切なテーマをまとめ、3行目に日常の助言を一つ添える。

【出力する前の確認】
書き終えたら、出力する前に次を確かめ、当てはまるところは書き直すこと。
・【いちばん大切なこと】で使わないと決めた言葉が、一つも入っていないか。
・理由が「何が見えたか」と「そこから何が読み取れるか」で書かれているか。
・過去世と今世が、別の話として書き分けられているか。
・メモにないことを作っていないか。
・結びが3行で、2行のまとめと、助言一つになっているか。長い励ましや感謝の挨拶が入っていないか。
・全体が1000文字程度か。

鑑定文の本文だけを出力してください。前置きや解説は不要です。`;

function generateSoulPromptClick(){ state.session.suggested = suggestSouls(state.session); state.session.prompt = buildSoulPrompt(); save(); render(); }

function copyText(id){
  const ta = document.getElementById(id);
  if(!ta) return;
  navigator.clipboard.writeText(ta.value).then(()=>showToast('コピーしました')).catch(()=>{
    ta.select(); document.execCommand('copy'); showToast('コピーしました');
  });
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-800 text-white text-sm px-4 py-2 rounded-full shadow-lg z-[100] transition-opacity duration-300';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 1800);
}

function card(inner, cls=''){ return `<div class="bg-white rounded-xl shadow-sm p-5 md:p-6 ${cls}">${inner}</div>`; }
function sectionTitle(t, sub=''){ return `<div class="mb-4"><h2 class="text-lg font-medium text-stone-800">${t}</h2>${sub?`<p class="text-sm text-stone-400 mt-1">${sub}</p>`:''}</div>`; }
function purposeBox(why, clear){
  return `<div class="bg-sky-50 rounded-lg p-3 text-xs text-stone-600 leading-relaxed mb-4 space-y-1.5">
    <p><mark class="mk-sky">🎯 なぜやるのか</mark> ${why}</p>
    <p><mark class="mk-green">✅ クリアの目安</mark> ${clear}</p>
  </div>`;
}
function moreBox(key, inner, label='もう少し知る'){
  return `<details class="mt-4 bg-stone-50 rounded-xl px-4 py-3" ${det(key)}>
    <summary class="flex items-center justify-between text-sm font-medium text-violet-700">
      <span>📖 ${label}</span><span class="chev text-stone-400">▾</span>
    </summary>
    <div class="mt-3 body-text text-stone-600">${inner}</div>
  </details>`;
}
function tile(path, value, label){
  const active = getDeep(path) === value;
  const cls = active ? 'bg-orange-100 text-orange-700 ring-2 ring-orange-400' : 'bg-stone-100 text-stone-600 hover:bg-stone-200';
  return `<button type="button" onclick="setField('${path}','${escAttr(value)}')" class="px-4 py-2 rounded-full text-sm transition ${cls}">${label}</button>`;
}
function tileGroup(path, options){
  return `<div class="flex flex-wrap gap-2">${options.map(o=>tile(path,o.v,o.l)).join('')}</div>`;
}
function toggleInList(path, value){
  const arr = getDeep(path) || [];
  const i = arr.indexOf(value);
  if(i>=0) arr.splice(i,1); else arr.push(value);
  setDeep(path, arr); save(); render();
}
function multiTiles(path, options){
  const arr = getDeep(path) || [];
  return `<div class="flex flex-wrap gap-2">${options.map(o=>{
    const on = arr.includes(o);
    return `<button type="button" aria-pressed="${on}" onclick="toggleInList('${path}','${escAttr(o)}')" class="px-3.5 py-1.5 rounded-full text-sm transition ${on ? 'bg-violet-100 text-violet-700 ring-2 ring-violet-400' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">${on?'✓ ':''}${o}</button>`;
  }).join('')}</div>`;
}
function textInput(path, placeholder=''){
  const v = getDeep(path) || '';
  return `<input type="text" value="${esc(v)}" placeholder="${esc(placeholder)}" oninput="setFieldSilent('${path}', this.value)" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-stone-300"/>`;
}
function textArea(path, placeholder='', rows=3){
  const v = getDeep(path) || '';
  return `<textarea rows="${rows}" placeholder="${esc(placeholder)}" oninput="setFieldSilent('${path}', this.value)" class="w-full border border-stone-200 rounded-lg px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-stone-300">${esc(v)}</textarea>`;
}
function autoSaveNote(){ return `<p class="text-xs text-stone-400 mt-3">※入力は、お使いのブラウザに自動で保存されます</p>`; }
function figure(svg, caption=''){
  return `<figure class="my-4 bg-white border border-stone-100 rounded-xl p-3"><div class="max-w-[460px] mx-auto">${svg}</div>${caption?`<figcaption class="text-xs text-stone-400 text-center mt-2">${caption}</figcaption>`:''}</figure>`;
}

const LAYER_R = {4:150, 3:112, 2:74, 1:36};
function layerLabelY(n){
  if(n===1) return 160;
  return 160 - (LAYER_R[n] + LAYER_R[n-1]) / 2;
}
function selLayer(n){ state.ui.layerSel = (state.ui.layerSel===n ? null : n); save(); render(); }
function renderLayerDiagram(){
  const sel = state.ui.layerSel;
  const rings = LAYER_ORDER.map(n=>{
    const L = LAYERS[n];
    const on = sel===n, dim = sel && !on;
    return `<circle class="layer-ring" cx="160" cy="160" r="${LAYER_R[n]}" fill="${L.color}" stroke="${on?'#6D28D9':L.stroke}" stroke-width="${on?4:1.5}" opacity="${dim?0.4:1}" onclick="selLayer(${n})"><title>${L.name}</title></circle>`;
  }).join('');
  const labels = LAYER_ORDER.map(n=>{
    const L = LAYERS[n], y = layerLabelY(n);
    const dim = sel && sel!==n;
    if(n===1){
      return `<g opacity="${dim?0.45:1}"><text x="160" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">① 第1層</text><text x="160" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">魂体</text></g>`;
    }
    return `<text x="160" y="${y+5}" text-anchor="middle" font-size="13" font-weight="bold" fill="#44403C" opacity="${dim?0.45:1}">${L.mark} 第${n}層・${L.short}</text>`;
  }).join('');
  const order = [4,3,2].map(n=>`<text x="${160 + (LAYER_R[n]+LAYER_R[n-1])/2}" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#6D28D9">${n}</text>`).join('');
  return `
    <svg viewBox="0 0 320 320" class="w-full max-w-[340px] mx-auto h-auto" role="img" aria-label="魂の4層の同心円図。中心が第1層の魂体、外側へ第2層、第3層、いちばん外が第4層。見る順番は外側から4、3、2、1">
      <defs><marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6D28D9"/></marker></defs>
      ${rings}
      <g pointer-events="none">${labels}
        <line x1="316" y1="168" x2="202" y2="168" stroke="#6D28D9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowV)"/>
        ${order}
      </g>
    </svg>`;
}
function renderLayerSection(){
  const sel = state.ui.layerSel;
  const L = sel ? LAYERS[sel] : null;
  return `

      <span class="text-xs font-normal text-stone-500">見る順番（外側から）</span>

}

function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

let medTimer = {remaining:900, running:false, id:null};
function startMedTimer(){
  if(medTimer.running) return;
  medTimer.running = true;
  playTones(MAIN_KEYS.map(k=>CHAKRAS.find(c=>c.key===k).freq));
  isMainPlaying = true;
  medTimer.id = setInterval(()=>{
    medTimer.remaining--;
    const el = document.getElementById('medTimerDisplay');
    if(el) el.textContent = fmtTime(Math.max(medTimer.remaining,0));
    if(medTimer.remaining<=0){
      clearInterval(medTimer.id); medTimer.running=false; stopAllTones();
      const btn = document.getElementById('medTimerStatus');
      if(btn) btn.textContent = '瞑想が完了しました🌸 お疲れさまでした';
    }
  },1000);
  render();
}
function pauseMedTimer(){ if(medTimer.id) clearInterval(medTimer.id); medTimer.running=false; stopAllTones(); render(); }
function resetMedTimer(){ if(medTimer.id) clearInterval(medTimer.id); medTimer = {remaining:900, running:false, id:null}; stopAllTones(); render(); }

const GAZE_TOTAL = 60;
const GAZE_RING_CIRC = 2 * Math.PI * 47;
let gazeTimer = {remaining:60, running:false, id:null, done:false};
function gazeRingOffset(){
  const ratio = Math.max(gazeTimer.remaining,0) / GAZE_TOTAL;
  return GAZE_RING_CIRC * (1 - ratio);
}
function updateGazeRing(){
  const ring = document.getElementById('gazeRingCircle');
  if(ring) ring.setAttribute('stroke-dashoffset', gazeRingOffset());
}
function startGazeTimer(){
  if(gazeTimer.running) return;
  gazeTimer.running = true;
  playTones(MAIN_KEYS.map(k=>CHAKRAS.find(c=>c.key===k).freq));
  isMainPlaying = true;
  gazeTimer.id = setInterval(()=>{
    gazeTimer.remaining--;
    const el = document.getElementById('gazeTimerDisplay');
    if(el) el.textContent = fmtTime(Math.max(gazeTimer.remaining,0));
    updateGazeRing();
    if(gazeTimer.remaining<=0){
      clearInterval(gazeTimer.id); gazeTimer.running=false; gazeTimer.done=true; stopAllTones();
      render();
    }
  },1000);
  render();
}
function skipGaze(){ if(gazeTimer.id) clearInterval(gazeTimer.id); gazeTimer.done=true; gazeTimer.running=false; stopAllTones(); render(); }
function resetGaze(){ if(gazeTimer.id) clearInterval(gazeTimer.id); gazeTimer = {remaining:60, running:false, id:null, done:false}; stopAllTones(); }

    const ring = document.getElementById('practiceRingCircle');
    if(ring) ring.setAttribute('stroke-dashoffset', practiceRingOffset());
    if(practiceTimer.remaining<=0){ clearInterval(practiceTimer.id); practiceTimer.running=false; stopAllTones(); render(); }
  },1000);
  render();
}

function startNewSession(){
  if(!confirm('新しい練習を始めますか？\n今の入力は、保存していない場合は消えます。保存済みの記録は残ります。')) return;
  state.session = newSession();
  resetGaze();
  save(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function pickOpt(n, qid, key, v){
  const s = state.session;
  if(s.ans[key]===v) delete s.ans[key]; else s.ans[key] = v;
  // 上の段を変えたら、下の段の選択を消す
  const clear = {_dom:['_area','_sub'], _area:['_sub'], _bc:['_cent']};
  for(const suf in clear){
    if(key.endsWith(suf)){ const base = key.slice(0, -suf.length); clear[suf].forEach(c=>delete s.ans[base+c]); }
  }
  delete s.hold[`l${n}_${qid}`];
  save(); render();
}
function markSeen(n, qid){
  state.session.seen[`l${n}_${qid}`] = true;
  save(); render();
  const items = LAYER_ITEMS[n], i = items.findIndex(q=>q.id===qid);
  const next = items[i+1] && document.getElementById(`q-${n}-${items[i+1].id}`);
  if(next) next.scrollIntoView({behavior:'smooth', block:'start'});
}
function toggleHold(n, qid){
  const k = `l${n}_${qid}`, s = state.session;
  if(s.hold[k]) delete s.hold[k]; else s.hold[k] = true;
  save(); render();
}

        ${!gazeTimer.running && !gazeTimer.done ? `<button onclick="startGazeTimer()" class="px-4 py-2 rounded-full bg-stone-800 text-white text-sm hover:bg-stone-700">スタート</button>` : ''}
        ${!gazeTimer.done ? `<button onclick="skipGaze()" class="px-4 py-2 rounded-full bg-stone-100 text-stone-500 text-sm hover:bg-stone-200">終える</button>` : ''}
      </div>
      ${gazeTimer.done ? `<p class="text-sm text-stone-600 mt-3 text-center">お疲れさまでした。浮かんだ印象が残っているうちに、第4層へ進みましょう。</p>` : ''}
    </div>
    ${stepNav('第4層へ')}
  `);
}

function optRow(n, qid, key, options, label='', grid=false){
  const cur = state.session.ans[key];
  return `<div class="mt-2.5">
    ${label ? `<p class="text-xs font-bold text-stone-500 mb-1.5">${label}</p>` : ''}
    <div class="${grid ? 'grid grid-cols-2 gap-2' : 'flex flex-wrap gap-2'}">
      ${options.map(o=>{
        const v = typeof o==='string' ? o : o.v, sub = typeof o==='string' ? '' : o.s, on = cur===v;
        return `<button type="button" aria-pressed="${on}" onclick="pickOpt(${n},'${qid}','${key}','${escAttr(v)}')" class="${grid ? 'text-left rounded-xl px-3 py-2' : 'rounded-full px-3.5 py-2'} text-sm transition ${on ? 'bg-orange-100 text-orange-800 ring-2 ring-orange-400' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">${on?'✓ ':''}${v}${sub ? `<span class="block text-[11px] ${on?'text-orange-700':'text-stone-400'}">${sub.split('〜').map((t,i,a)=>`<span class="inline-block">${t}${i<a.length-1?'〜':''}</span>`).join('')}</span>` : ''}</button>`;
      }).join('')}
    </div>
  </div>`;
}
function inputRow(key, label, ph=''){
  return `<div class="mt-3"><p class="text-xs font-bold text-stone-500 mb-1">${label}</p>${textInput('session.txt.'+key, ph)}</div>`;
}
function renderRegion(n, q){
  const b = holdKey(n,q), A = state.session.ans;
  const dom = A[b+'_dom'], area = A[b+'_area'];
  let h = optRow(n, q.id, b+'_dom', REGION_TOP, '国内ですか、国外ですか');
  if(dom==='国内・日本') h += optRow(n, q.id, b+'_area', REGION_JP, '地方（分かれば）');
  if(dom==='国外'){
    h += optRow(n, q.id, b+'_area', REGION_WORLD, '地域（分かれば）');
    if(area && REGION_SUB[area]) h += optRow(n, q.id, b+'_sub', REGION_SUB[area], 'さらにくわしく（分かれば）');
  }
  if(dom && dom!=='分からない'){
    const ph = (area==='北極圏' || area==='南極地域') ? '分かる範囲で、地域を補足' : '例：出雲のあたり、フィレンツェ';
    h += inputRow(b+'_place', '国や地名が浮かんだら（一行・任意）', ph);
  }
  if(dom) h += `<p class="text-xs text-stone-400 mt-2">分かる所まで選べば大丈夫です。</p>`;
  return h;
}
function renderEra(n, q){
  const b = holdKey(n,q), bc = state.session.ans[b+'_bc'];
  let h = optRow(n, q.id, b+'_bc', ERA_TOP, '紀元前ですか、紀元後ですか');
  if(bc==='紀元後') h += optRow(n, q.id, b+'_cent', CENT_AD, '何世紀ごろですか（分かれば）', true);
  if(bc==='紀元前') h += optRow(n, q.id, b+'_cent', CENT_BC, '何世紀ごろですか（分かれば）', true);
  if(bc && bc!=='分からない') h += `<p class="text-xs text-stone-400 mt-2">世紀が分からないときは、選ばずに次へ進めます。</p>`;
  return h;
}
function qDone(n, q){
  const s = state.session, b = holdKey(n,q);
  if(s.hold[b] || s.seen[b]) return true;
  if(Object.keys(s.ans).some(k=>k.startsWith(b+'_'))) return true;
  if(Object.keys(s.txt).some(k=>k.startsWith(b+'_') && (s.txt[k]||'').trim())) return true;
  return !!(q.colors && (s[q.colors]||[]).length);
}
function renderQuestion(n, q, idx, isCurrent=false){
  const s = state.session;
  const held = !!s.hold[holdKey(n,q)];
  let body = '';
  if(q.era) body += renderEra(n, q);
  if(q.region) body += renderRegion(n, q);
  (q.sel||[]).forEach(x=>{
    if(selVisible(s,n,q,x)) body += optRow(n, q.id, selKey(n,q,x), x.o, (q.sel.length>1 && x.l) ? x.l : '');
  });
  if(q.colors) body += `<div class="mt-2.5">${multiTiles('session.'+q.colors, COLORS)}</div>`;
  (q.inp||[]).forEach(i=>{ body += inputRow(selKey(n,q,i), i.l, i.ph||''); });
  return `
    <div id="q-${n}-${q.id}" class="scroll-mt-28 border ${held ? 'border-sky-200 bg-sky-50/40' : isCurrent ? 'border-orange-200' : 'border-stone-200'} rounded-xl p-3.5">
      <p class="text-sm font-bold text-stone-700"><span class="text-stone-400 mr-1">${idx+1}.</span>${q.t}</p>
      ${q.g ? `<p class="text-xs text-stone-500 mt-0.5 leading-relaxed">${q.g}</p>` : ''}
      ${body}
      <div class="flex flex-wrap gap-2 mt-3">
        <button type="button" onclick="toggleHold(${n},'${q.id}')" class="text-xs px-3 py-1.5 rounded-full ${held ? 'bg-sky-100 text-sky-700' : 'bg-white border border-stone-200 text-stone-500'}">${held ? '✓ 保留にしました（タップで戻す）' : '分からない・保留して進む'}</button>
        ${isCurrent ? `<button type="button" onclick="markSeen(${n},'${q.id}')" class="text-xs px-3 py-1.5 rounded-full bg-stone-800 text-white">次の質問へ →</button>` : ''}
      </div>
    </div>`;
}
function renderStepLayer(n){
  const L = LAYERS[n];
  const items = LAYER_ITEMS[n];
  const stepwise = STEPWISE_LAYERS.includes(n);
  let shown = items.length;
  if(stepwise){ const open = items.findIndex(q=>!qDone(n,q)); shown = open<0 ? items.length : open+1; }
  const doneCount = items.filter(q=>qDone(n,q)).length;
  const allDone = !stepwise || doneCount===items.length;
  return `
    ${card(`
      <div class="flex items-center gap-4 mb-3">
        <div class="w-24 h-24 shrink-0">${soulOrb(n)}</div>
        <div class="min-w-0">
          <p class="text-xs text-stone-400">外側から ${LAYER_ORDER.indexOf(n)+1} / 4</p>
          <h2 class="text-lg font-medium text-stone-800">${L.mark} ${n===1 ? '第1層・魂体のルーツ' : L.name}</h2>
          <p class="text-sm text-amber-700">${L.short}</p>
        </div>
      </div>
      <p class="body-text text-stone-700">${L.desc}</p>
      <p class="text-sm text-stone-500 mt-2">${n===1 ? '魂体と、そのルーツを順番に見ていきます。' : n===2 ? 'いつ・どこで・誰が・何をしていたかを、順番に記録します。' : 'この層に、そっと意識を向けてください。'}パッと浮かんだものを選びます。分からない質問は、保留して進めます。</p>
    `)}
    ${card(`
      ${stepwise ? `<p class="text-xs text-stone-400 mb-2 text-right">${doneCount} / ${items.length}</p>` : ''}
      <div class="space-y-3">${items.slice(0, shown).map((q,i)=>renderQuestion(n, q, i, stepwise && i===shown-1 && !qDone(n,q))).join('')}</div>
    `)}
    ${allDone ? card(`
      <h3 class="text-base font-medium text-stone-800 mb-1">${NOTE_LABEL[n].l}</h3>
      <p class="text-xs text-stone-500 mb-2">${n===4 ? '見えたものや感じたものを、自由に書きます。' : '追加で見えたものや、浮かんだビジョンを書きます。'}何もなければ空けたままで大丈夫です。</p>
      ${textArea(`session.note.${n}`, NOTE_LABEL[n].ph, 5)}
      ${autoSaveNote()}
      ${stepNav(n===1 ? '魂の種類へ' : `第${n-1}層へ`)}
    `) : card(`
      <p class="text-xs text-stone-500">質問に答えるか「次の質問へ」を押すと、次の質問が出ます。最後まで進むと、ビジョンを書く欄が出ます。</p>
      ${stepNav(n===1 ? '魂の種類へ' : `第${n-1}層へ`)}
    `)}`;
}

function toggleSoulPick(name){
  const s = state.session;

  s.soulPicks = (s.soulPicks[0]===name) ? [] : [name];
  if(s.soulStatus==='unknown') s.soulStatus = '';
  save(); render();
}

  const s = state.session;

  if(s.soulStatus==='unknown') s.soulPicks = [];
  if(s.soulStatus==='none'){ s.soulPicks = s.soulPicks.filter(n=>!s.suggested.some(c=>c.name===n)); state.ui.open['soul-all'] = true; }
  save(); render();
}

            <div class="flex items-center gap-3">

    <div class="flex flex-wrap gap-2 mt-3">

function saveRecord(){
  const s = state.session;
  s.suggested = suggestSouls(s);
  const snap = JSON.parse(JSON.stringify(s));
  snap.savedAt = new Date().toISOString();
  if(s.recId){
    const i = state.records.findIndex(r=>r.recId===s.recId);
    if(i>=0) state.records[i] = snap; else state.records.unshift(snap);
  } else {
    s.recId = 'r' + Date.now().toString(36);
    snap.recId = s.recId;
    state.records.unshift(snap);
  }
  if(HW_TARGETS.some(t=>t.k===s.target) && (state.homework[s.target]||'none')==='none'){
    state.homework[s.target] = 'practiced';
  }
  save(); render();
  showToast('記録を保存しました');
}

function renderWork(){
  const s = state.session;
  let body = '';
  switch(s.step){
    case 0: body = renderStepTarget(); break;
    case 1: body = renderStepGaze(); break;
    case 2: body = renderStepLayer(4); break;
    case 3: body = renderStepLayer(3); break;
    case 4: body = renderStepLayer(2); break;
    case 5: body = renderStepLayer(1); break;
    case 6: body = renderStepFinal(); break;
  }
  return `
    <div class="space-y-4 fade-in">
      <div id="work-top" class="scroll-mt-28 bg-white rounded-xl shadow-sm p-4">
        <div class="flex items-center justify-between mb-2">

          <button onclick="startNewSession()" class="text-xs text-violet-600 underline">新しい練習</button>
        </div>
        ${stepBar()}
      </div>
      ${body}
    </div>`;
}

  ['怖くて途中でやめたくなります。続けても大丈夫ですか？', `無理に続ける必要はありません。少しでも強い恐怖や不快感があるときは、<mark class="mk-rose">いったんワークを中断してグラウンディング</mark>（水を飲む、深呼吸、足裏を意識するなど）を優先してください。<br><br>
体調や気分が落ち着いているタイミングで、少しずつ慣らしていくくらいでちょうど良いです。`],
  ['自分の願望や思い込みが混ざっている気がします。思い込みとの違いが分かりません', `とても良い気づきです。この区別をつきやすくするために、本教材ではあえて第6チャクラ（直感・イメージ）を使わずに、感情・愛・高い意識の3チャクラだけでトレーニングしています。<br><br>
それでも迷うときは、「〜であってほしい」という願いから浮かんだものか、「勝手に、唐突に」浮かんできたものかを振り返ってみてください。<mark class="mk-purple">後者のほうが直感から来ている</mark>可能性が高いです。もともと知っていたことは記録に混ぜず、ワーク中に浮かんだことだけを書くのも、見分けるのに役立ちます。`],
  ['相談者を見るときと、自分自身を見るときで感覚が違います', `自然なことです。対象が変われば受け取る印象も変わるため、感じ方に差が出て当然です。<br><br>
相談者を見るときは、始める前に一呼吸おいて、その方のお顔や名前を軽く思い浮かべてから始めると、意識のピントが合いやすくなります。感覚の違いそのものも、大切な情報として記録しておきましょう。`],
  ['色や形が複数同時に浮かんでしまい、一つに絞れません', `無理に一つへ絞る必要はありません。色はいくつでも選べます。<mark class="mk-orange">最初に浮かんだもの、または一番強く感じたもの</mark>から順に選び、残りは「見えたもの・感じたもの」や「補足の記録」の欄に書き出してください。情報が多いことは、むしろ豊かに受け取れているサインです。`],
  ['セッションのあと、体がだるい・疲れることがあります', `感覚を開いたまま日常に戻ると、エネルギーの境界があいまいになり、疲れやすくなることがあります。<br><br>
ワークの後は必ず<mark class="mk-green">グラウンディング</mark>（水を飲む、深呼吸、足裏を意識して立つなど）を行う習慣をつけてください。だるさが続く場合は、無理に毎日行わず間隔をあけましょう。`],
  ['鑑定文の内容が自分（相談者）に当てはまっていない気がします。どう受け止めればいいですか？', `生成された鑑定文は、断定に見えても100％の的中を保証するものではなく、<mark class="mk-sky">気づきのきっかけ</mark>として作られています。<br><br>
すべてを鵜呑みにせず、自分（または相談者）の心に引っかかった部分だけを受け取り、残りは「そういう見方もあるのか」くらいの距離感で扱ってください。先生からのフィードバックや、あとで分かったことと見比べていくと、記録と実感のズレが少しずつ見えてきます。`],
];

function setHomework(k, v){ state.homework[k] = v; save(); render(); }
function deleteRecord(recId){
  if(!confirm('この記録を削除しますか？\n削除すると元に戻せません。')) return;
  state.records = state.records.filter(r=>r.recId!==recId);
  if(state.session.recId===recId) state.session.recId = '';
  save(); render();
}
function makeRecordPrompt(recId){
  const r = state.records.find(x=>x.recId===recId);
  if(!r) return;
  state.ui.recPrompt = {id:recId, text:buildSoulPrompt(r)};
  save(); render();
}
function renderHomework(){
  return card(`
    ${sectionTitle('ワーク一覧・宿題', '身近な対象から、順番に練習していきましょう')}
    <div class="bg-amber-50 rounded-xl p-4 mb-4 body-text text-stone-700">
      はじめは、安心して意識を向けられる身近な動物から。慣れたら家族や友人へ広げましょう。<br><br>
      <b>宿題のやり方</b><br>
      ① 下の一覧から、対象を一つ選びます。<br>
      ②「魂を見る」で、第4層から第1層・魂体のルーツまで、層ごとの印象を記録します。<br>
      ③ 最後のページで魂の種類の候補を確かめ、提出用文章をつくって先生に送ります。<br>
      記録を保存すると「練習済み」になります。先生からフィードバックをもらって見直したら、「振り返り済み」に切り替えましょう。
    </div>
    <div class="space-y-2">
      ${HW_TARGETS.map(t=>{ const st = state.homework[t.k] || 'none'; return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border border-stone-100 rounded-xl px-3 py-2.5">
          <p class="text-sm text-stone-700">${t.e} ${t.l}</p>
          <div class="flex gap-1.5">
            ${HW_STATUS.map(o=>`<button onclick="setHomework('${t.k}','${o.v}')" aria-pressed="${st===o.v}" class="px-3 py-1.5 rounded-full text-xs ${st===o.v ? (o.v==='reviewed'?'bg-emerald-100 text-emerald-700 ring-2 ring-emerald-300':o.v==='practiced'?'bg-amber-100 text-amber-700 ring-2 ring-amber-300':'bg-stone-200 text-stone-700') : 'bg-stone-50 text-stone-400'}">${o.l}</button>`).join('')}
          </div>
        </div>`; }).join('')}
    </div>
  `);
}
function renderRecords(){
  const recs = state.records;
  return card(`
    ${sectionTitle('これまでの記録', '対象・日付ごとに残っています')}
    ${!recs.length ? `<p class="text-sm text-stone-500">まだ保存した記録はありません。「魂を見る」の最後の「提出用文章」で保存できます。</p>` : `
      <div class="space-y-2">
        ${recs.map(r=>`
          <details class="border border-stone-200 rounded-xl px-3 py-2.5" ${det('rec-'+r.recId)}>
            <summary class="flex items-center justify-between gap-2 text-sm">
              <span class="min-w-0"><span class="text-stone-400 text-xs">${fmtDate(r.savedAt)}</span><br><b class="text-stone-700">${esc(targetLabel(r))}</b><span class="text-stone-500">　${esc(soulTypeText(r))}</span></span>
              <span class="chev text-stone-300 shrink-0">▾</span>
            </summary>
            <pre class="mt-3 whitespace-pre-wrap text-xs text-stone-600 bg-stone-50 rounded-lg p-3 font-sans leading-relaxed">${esc(sessionRecordText(r))}</pre>
            ${(r.letter||'').trim() ? `
              <p class="text-xs font-bold text-stone-500 mt-3 mb-1">提出用文章</p>
              <textarea id="recLetter-${r.recId}" rows="8" readonly class="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm text-stone-600">${esc(r.letter)}</textarea>
              <button onclick="copyText('recLetter-${r.recId}')" class="mt-1 px-3 py-1.5 rounded-full bg-orange-100 text-orange-700 text-xs">📋 全文をコピー</button>` : ''}
            <div class="flex flex-wrap gap-2 mt-2">
              <button onclick="makeRecordPrompt('${r.recId}')" class="px-3 py-1.5 rounded-full bg-stone-800 text-white text-xs">この記録でプロンプトをつくる</button>
              <button onclick="deleteRecord('${r.recId}')" class="px-3 py-1.5 rounded-full bg-stone-100 text-stone-500 text-xs">削除</button>
            </div>
            ${state.ui.recPrompt && state.ui.recPrompt.id===r.recId ? `
              <textarea id="recPrompt-${r.recId}" rows="10" class="mt-2 w-full border border-stone-200 rounded-lg px-3 py-2 text-xs font-mono text-stone-600">${esc(state.ui.recPrompt.text)}</textarea>
              <button onclick="copyText('recPrompt-${r.recId}')" class="mt-1 px-3 py-1.5 rounded-full bg-orange-100 text-orange-700 text-xs">📋 コピーする</button>` : ''}
          </details>`).join('')}
      </div>`}
  `);
}
function sessionHasAnswers(s){
  return Object.keys(s.ans).length || Object.values(s.txt).some(v=>(v||'').trim()) || s.colors.length || (s.colors1||[]).length || Object.values(s.note).some(v=>(v||'').trim());
}
function renderFeedback(){
  const s = state.session;
  const f = state.feedback;
  const other = isOtherTarget();
  const label = esc(targetLabel());
  const noSessionYet = !sessionHasAnswers(s) && !state.records.length;
  const A = s.ans;
  const heavyNegative = A['l4_q1_light']==='暗い' && (A['l4_q1_weight']==='重い' || ['不安や恐れ','悲しみや後悔'].includes(A['l4_q1_mood']) || ['不安や恐れ','悲しみや後悔','怒りやがまん'].includes(A['l3_q1_emotion']));
  const anyPattern = f.shapeType || f.wordType || f.inconsistentType || noSessionYet || heavyNegative;

  return `
    <div class="space-y-4 fade-in">
      ${renderHomework()}
      ${renderRecords()}
      ${card(`
        ${sectionTitle('フィードバック', 'よくあるケース・疑問にお答えします')}
        <p class="text-sm text-stone-500 mb-3">最初のうちは、うまく見えないと感じる方が多くいます。当てはまるものにチェックを入れてみてください。</p>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm text-stone-600">
            <input type="checkbox" ${f.shapeType?'checked':''} onchange="setField('feedback.shapeType', this.checked)"/>
            色ではなく、形で見えてしまう
          </label>
          <label class="flex items-center gap-2 text-sm text-stone-600">
            <input type="checkbox" ${f.wordType?'checked':''} onchange="setField('feedback.wordType', this.checked)"/>
            映像ではなく、言葉としてメッセージが入ってきた
          </label>
          <label class="flex items-center gap-2 text-sm text-stone-600">
            <input type="checkbox" ${f.inconsistentType?'checked':''} onchange="setField('feedback.inconsistentType', this.checked)"/>
            毎回、見える色や形が違って一貫性がない
          </label>
        </div>
      `)}

      ${noSessionYet ? card(`
        <p class="text-sm text-stone-700 leading-relaxed">
          まだワークが始まっていないようですね。<br><br>
          まずは<mark class="mk-sky">「魂を見る」</mark>で、ソウルシルエットを見つめてから、外側の第4層から順に答えてみましょう。正解を探す必要はありません。最初に浮かんだものが、あなたにとっての"答え"です。
        </p>
        <button onclick="goMenu('work')" class="mt-3 px-4 py-2 rounded-full bg-stone-800 text-white text-sm">魂を見るへ</button>
      `, 'border border-sky-100') : ''}

      ${f.shapeType ? card(`
        <p class="text-sm text-stone-700 leading-relaxed">
          <mark class="mk-orange">これはレアな見え方です。</mark><br><br>
          魂の印象を、色ではなく「形質」として捉えていける方です。動物の形や幾何学模様など、形として情報を受け取る感覚は、比較的めずらしい回路です。<mark class="mk-green">大切にしていきましょう。</mark><br><br>
          見え方に優劣はありません。色で見える人も形で見える人も、同じように魂の印象を受け取っています。今後は<mark>「〇〇型」</mark>という書き方で記録を積み重ねていくと、あなた自身の見え方のクセがどんどんはっきりしていきます。
        </p>
      `, 'border border-orange-100') : ''}

      ${f.wordType ? card(`
        <p class="text-sm text-stone-700 leading-relaxed">
          映像として見えなくても、まったく問題ありません。あなたは<mark class="mk-sky">「言語優位」タイプ</mark>の受け取り方をしている可能性が高いです。<br><br>
          このタイプの方は、瞑想の組み立てを少し変えるとぐっと感覚がつかみやすくなります。<br><br>
          ・第6チャクラを使う瞑想ではなく、第5チャクラ（のど／表現）を軽く意識に加えてみてください。<br>
          ・「見ようとする」のではなく、「浮かんできた言葉をそのまま声に出す・書き出す」練習に切り替えてください。<br>
          ・各層の「補足の記録」の欄に、「最初に浮かんだ一言」を疑わずにメモする習慣をつけましょう。<br><br>
          見え方は人それぞれです。あなたに合った回路で受け取れば大丈夫です。
        </p>
      `, 'border border-sky-100') : ''}

      ${f.inconsistentType ? card(`
        <p class="text-sm text-stone-700 leading-relaxed">
          毎回、見え方が変わるのは決しておかしなことではありません。<br><br>
          魂から受け取る印象は<mark class="mk-purple">いつも一定ではなく、その日の調子や心の状態によって揺らぐもの</mark>だからです。今日は色で見え、明日は形で見えることもあります。<br><br>
          一貫性がないことを不安に思うのではなく、<mark class="mk-green">「今日はどう見えたか」を毎回そのまま記録していく</mark>ことが、精度を上げる一番の近道です。記録は日付ごとに残るので、積み重ねていくと、ゆるやかな傾向が見えてきます。
        </p>
      `, 'border border-purple-100') : ''}

      ${heavyNegative ? card(`
        <p class="text-sm text-stone-700 leading-relaxed">
          今回の回答が、暗さや重さ、恐れ・不安といった<mark class="mk-rose">"重たい"</mark>印象に偏っていますね。<br><br>
          ${other
            ? `これは、${label}の魂の奥に、まだ整理しきれていない感情が眠っているサインかもしれません。同時に、見ているあなた自身の感情のフィルターが結果に影響している可能性もあります。どちらの要素も否定せず、そのまま記録に残しておきましょう。`
            : `これは、あなたの魂の奥に、まだ整理しきれていない感情が眠っているサインかもしれません。`}
          でも、少し立ち止まって考えてみてください。<br><br>
          本当は見てもいいはずのものを、あなた自身が「見てはいけない」とブロックをかけていませんか。<br><br>
          怖いから見ないのではなく、見て、知って、受け止めることで、その重さは初めて<mark class="mk-rose">"手放せるもの"</mark>に変わっていきます。チャクラ瞑想でグラウンディングしてから、もう一度向き合ってみましょう。
        </p>
        <button onclick="goMenu('basics')" class="mt-3 px-4 py-2 rounded-full bg-stone-800 text-white text-sm">チャクラ瞑想へ</button>
      `, 'border border-rose-100') : ''}

      ${!anyPattern ? card(`
        <p class="text-sm text-stone-500">今のところ、特に気になるブロックは見当たりません。順調に進んでいます。この調子で、浮かんだままを疑わずに記録していきましょう。</p>
      `) : ''}

      ${card(`
        ${sectionTitle('よくある質問（FAQ）', 'その他、練習中によく寄せられる疑問への回答です')}
        <div class="divide-y divide-stone-100">
          ${FAQS.map(([q,a],i)=>`
            <details class="py-3" ${det('faq-'+i)}>
              <summary class="flex items-center justify-between text-stone-700 font-medium text-sm gap-3">
                <span>Q. ${q}</span>
                <span class="chev text-stone-300 shrink-0">▾</span>
              </summary>
              <div class="mt-3 text-sm leading-relaxed text-stone-600">A. ${a}</div>
            </details>
          `).join('')}
        </div>
      `)}
    </div>
  `;
}

/* ============ ヘッダー & レイアウト ============ */
const MENUS = [
  {k:'basics',   l:'<span class="inline-block">基礎解説＋</span><span class="inline-block">チャクラ瞑想</span>'},
  {k:'howto',    l:'やり方'},
  {k:'work',     l:'魂を見る'},
  {k:'feedback', l:'フィードバック'},
];
function renderHeader(){
  return `
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-stone-200">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div>
          <p class="logo-font text-sm tracking-widest text-stone-400">SOUL VISION</p>
          <p class="text-base font-medium text-stone-800 -mt-0.5">魂視メソッド教材</p>
        </div>
        <div class="flex flex-col items-end gap-0.5">
          <div class="flex items-center gap-2">
            <button onclick="toggleMainBGM()" aria-label="BGMの再生・停止" class="w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center text-stone-600">${isMainPlaying?'⏸':'▶'}</button>
            <input type="range" min="0" max="1" step="0.01" value="${state.volume}" oninput="setVolume(this.value)" aria-label="音量" class="w-16 accent-stone-500"/>
          </div>
          <p class="text-[10px] text-stone-400">🔊 端末本体の音量も上げてね</p>
        </div>
      </div>
      <nav class="max-w-3xl mx-auto px-4 pb-3 grid grid-cols-2 sm:flex gap-2">
        ${MENUS.map(m=>`
          <button onclick="goMenu('${m.k}')" class="px-3 sm:px-4 py-1.5 rounded-full text-[13px] sm:text-sm leading-snug sm:whitespace-nowrap transition ${state.currentMenu===m.k ? 'bg-stone-800 text-white' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}">${m.l}</button>
        `).join('')}
      </nav>
    </header>
  `;
}
function renderMain(){
  switch(state.currentMenu){
    case 'basics':   return renderBasics();
    case 'howto':    return renderHowto();
    case 'work':     return renderWork();
    case 'feedback': return renderFeedback();
    default: return '';
  }
}
let lastViewKey = '';
function render(){
  const app = document.getElementById('app');
  // 同じ画面の中で選び直したときは、表示位置を保ち、ふわっと出る動きもさせない
  const viewKey = state.currentMenu + ':' + state.session.step;
  const sameView = viewKey === lastViewKey;
  lastViewKey = viewKey;
  const keepY = window.scrollY;
  app.innerHTML = `
    ${renderPwaBanner()}
    ${renderHeader()}
    <main class="max-w-3xl mx-auto px-4 py-6 pb-20">
      ${renderMain()}
      ${renderInstallGuide()}
      <p class="text-center text-xs text-stone-300 mt-10">Relife Spiritual — 魂視メソッド教材</p>
    </main>
  `;
  // 今のステップを、横スクロールの見える位置へ
  const bar = document.getElementById('stepBar');
  const cur = bar && bar.querySelector('[aria-current="step"]');
  if(cur) bar.scrollLeft = cur.offsetLeft - bar.offsetLeft - (bar.clientWidth - cur.offsetWidth) / 2;
  if(sameView){
    app.querySelectorAll('.fade-in').forEach(el=>el.classList.remove('fade-in'));
    window.scrollTo(0, keepY);
  }
}

load();
render();
</script>
</body>
</html>
